<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 3D Web Experience Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 50%, #0d1117 0%, #05070a 100%);
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* UI Overlay */
    .ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 40px;
    }
    .header {
      pointer-events: auto;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(88, 166, 255, 0.15);
      border: 1px solid rgba(88, 166, 255, 0.3);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #58a6ff;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background: #3fb950;
      border-radius: 50%;
      box-shadow: 0 0 10px #3fb950;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #8b949e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 15px;
      color: #8b949e;
      margin-top: 6px;
      max-width: 480px;
      line-height: 1.5;
    }
    /* Controls Glass Card */
    .controls-card {
      pointer-events: auto;
      background: rgba(22, 27, 34, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 22px 24px;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }
    .controls-card:hover {
      border-color: rgba(88, 166, 255, 0.4);
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #58a6ff;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .control-group {
      margin-bottom: 14px;
    }
    .control-label {
      font-size: 13px;
      color: #c9d1d9;
      margin-bottom: 8px;
      display: block;
      font-weight: 500;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #f0f6fc;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(88, 166, 255, 0.2);
      border-color: #58a6ff;
    }
    .btn.active {
      background: #1f6feb;
      border-color: #58a6ff;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(31, 111, 235, 0.6);
    }
    /* Color Swatches */
    .color-swatches {
      display: flex;
      gap: 10px;
    }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }
    .swatch:hover {
      transform: scale(1.15);
    }
    .swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 10px currentColor;
    }
    .footer-hint {
      pointer-events: auto;
      font-size: 13px;
      color: #6e7681;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hint-key {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #c9d1d9;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <!-- 3D Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Overlay UI -->
  <div class="ui-container">
    <div class="header">
      <div class="badge">
        <span class="badge-dot"></span>
        Skill: web3d-integration-patterns active
      </div>
      <h1>Interactive 3D Experience</h1>
      <p class="subtitle">Built with Three.js & procedural WebGL patterns installed from the GitHub Design Skills repository.</p>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <!-- Controls -->
      <div class="controls-card">
        <div class="card-title">
          <span>Realtime Controls</span>
          <span style="font-size: 11px; color: #8b949e; text-transform: none;">60 FPS WebGL</span>
        </div>

        <div class="control-group">
          <label class="control-label">Geometry</label>
          <div class="btn-row">
            <button class="btn active" data-shape="torus">Torus Knot</button>
            <button class="btn" data-shape="icosahedron">Crystal</button>
            <button class="btn" data-shape="sphere">Energy Sphere</button>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Accent Color</label>
          <div class="color-swatches">
            <div class="swatch active" style="background: #38bdf8; color: #38bdf8;" data-color="0x38bdf8"></div>
            <div class="swatch" style="background: #ec4899; color: #ec4899;" data-color="0xec4899"></div>
            <div class="swatch" style="background: #a855f7; color: #a855f7;" data-color="0xa855f7"></div>
            <div class="swatch" style="background: #22c55e; color: #22c55e;" data-color="0x22c55e"></div>
            <div class="swatch" style="background: #f59e0b; color: #f59e0b;" data-color="0xf59e0b"></div>
          </div>
        </div>

        <div class="control-group" style="margin-bottom: 0;">
          <label class="control-label">Wireframe Mode</label>
          <div class="btn-row">
            <button class="btn" id="toggle-wireframe">Toggle Wireframe</button>
            <button class="btn" id="toggle-speed">Boost Speed</button>
          </div>
        </div>
      </div>

      <!-- Footer Info -->
      <div class="footer-hint">
        <span class="hint-key">Mouse Move / Drag</span> Orbit & Parallax
        <span class="hint-key">Scroll</span> Zoom
      </div>
    </div>
  </div>

  <!-- Import Three.js via ES Module -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Scene, Camera, Renderer
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05070a, 0.04);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 7);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    // 2. Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 3;
    controls.maxDistance = 14;

    // 3. Lighting Architecture (from threejs-webgl pattern)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0x38bdf8, 2.5);
    keyLight.position.set(5, 5, 5);
    scene.add(keyLight);

    const fillLight = new THREE.PointLight(0xa855f7, 3, 20);
    fillLight.position.set(-6, -3, 3);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0xffffff, 2, 15);
    rimLight.position.set(0, 6, -4);
    scene.add(rimLight);

    // 4. Geometries
    const geometries = {
      torus: new THREE.TorusKnotGeometry(1.4, 0.45, 200, 32),
      icosahedron: new THREE.IcosahedronGeometry(1.9, 0),
      sphere: new THREE.SphereGeometry(1.8, 64, 64)
    };

    // Material (Physical Glass / Metal with roughness)
    const mainMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x38bdf8,
      metalness: 0.2,
      roughness: 0.1,
      transmission: 0.85,
      ior: 1.5,
      thickness: 1.2,
      specularIntensity: 1.5,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      wireframe: false
    });

    // Mesh
    const mainMesh = new THREE.Mesh(geometries.torus, mainMaterial);
    scene.add(mainMesh);

    // Inner glowing core
    const coreGeo = new THREE.IcosahedronGeometry(0.8, 2);
    const coreMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      wireframe: true,
      transparent: true,
      opacity: 0.4
    });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    scene.add(coreMesh);

    // 5. Ambient Floating Particles Field
    const particleCount = 700;
    const particleGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const baseColor = new THREE.Color(0x38bdf8);
    const altColor = new THREE.Color(0xa855f7);

    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 22;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 22;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 22;

      const mixedColor = baseColor.clone().lerp(altColor, Math.random());
      colors[i * 3] = mixedColor.r;
      colors[i * 3 + 1] = mixedColor.g;
      colors[i * 3 + 2] = mixedColor.b;
    }

    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particleMaterial = new THREE.PointsMaterial({
      size: 0.05,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    // 6. Animation Loop & Responsive Handling
    let speedMultiplier = 1.0;
    const clock = new THREE.Clock();

    // Mouse Parallax target
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 0.6;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 0.6;
    });

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime() * speedMultiplier;

      // Rotate Main Mesh
      mainMesh.rotation.x = elapsedTime * 0.4;
      mainMesh.rotation.y = elapsedTime * 0.6;

      // Inner Core Counter-Rotate
      coreMesh.rotation.x = -elapsedTime * 0.5;
      coreMesh.rotation.y = -elapsedTime * 0.7;

      // Particle Field Gentle Drift
      particles.rotation.y = elapsedTime * 0.05;

      // Smooth Parallax Lerp
      scene.position.x += (mouseX - scene.position.x) * 0.05;
      scene.position.y += (-mouseY - scene.position.y) * 0.05;

      // Orbit controls update
      controls.update();

      // Render
      renderer.render(scene, camera);
    }
    animate();

    // Responsive Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    // 7. Interactive UI Bindings
    // Shape Buttons
    document.querySelectorAll('[data-shape]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-shape]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const shape = e.target.getAttribute('data-shape');
        mainMesh.geometry = geometries[shape];
      });
    });

    // Color Swatches
    document.querySelectorAll('.swatch').forEach(swatch => {
      swatch.addEventListener('click', (e) => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        e.target.classList.add('active');
        const hex = parseInt(e.target.getAttribute('data-color'));
        mainMaterial.color.setHex(hex);
        coreMat.color.setHex(hex);
        keyLight.color.setHex(hex);
      });
    });

    // Wireframe Toggle
    const wireframeBtn = document.getElementById('toggle-wireframe');
    wireframeBtn.addEventListener('click', () => {
      mainMaterial.wireframe = !mainMaterial.wireframe;
      wireframeBtn.classList.toggle('active', mainMaterial.wireframe);
    });

    // Speed Boost Toggle
    const speedBtn = document.getElementById('toggle-speed');
    speedBtn.addEventListener('click', () => {
      speedMultiplier = speedMultiplier === 1.0 ? 3.0 : 1.0;
      speedBtn.classList.toggle('active', speedMultiplier > 1.0);
    });
  </script>
</body>
</html>
